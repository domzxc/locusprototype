services:
  - type: web
    name: domtransport
    runtime: static
    branch: main
    buildCommand: npm ci && npm test && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: SKIP_INSTALL_DEPS
        value: "true"
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
